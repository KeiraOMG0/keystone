[alembic]
# Path is relative to where alembic is invoked from (repo root), matching
# how this project's tooling is normally run (`./venv/Scripts/python.exe -m
# alembic -c server/alembic.ini ...` from the repo root). env.py also sets
# an explicit absolute script_location as a defensive fallback — see there.
script_location = server/alembic

# Distinct alembic_version table from the bot's own migration tracking
# (database/migrations/runner.py uses a "schema_migrations" table on
# bot.db) — this Alembic setup only ever touches server/dashboard.db.
version_table = alembic_version

prepend_sys_path = .

version_path_separator = os

sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
